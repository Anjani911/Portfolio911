<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Links</title>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: #000;
			color: #fff;
			font-family: Arial, sans-serif;
		}
		.links {
			display: flex;
			gap: 4rem;
			text-align: center;
		}
		.link {
			color: #fff;
			text-decoration: none;
			transition: transform 0.2s, color 0.2s;
		}
		.link:hover { color: #bbb; transform: translateY(-4px); }
		.icon {
			width: 72px;
			height: 72px;
			display: block;
			margin: 0 auto 0.75rem;
			fill: currentColor;
		}
		.link span { font-size: 1.1rem; }
	</style>
</head>
